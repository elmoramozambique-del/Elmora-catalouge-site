<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ELMORA Catalogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ELMORA Furniture — the complete range.">
<meta name="robots" content="index,follow">
<!-- Google serves the photos. Sending no referrer removes one reason it
     could refuse them, and works on any host, not just Netlify. -->
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%232E2E2E'/><text x='8' y='12' font-size='11' font-family='sans-serif' fill='%23FAF8F5' text-anchor='middle'>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  /* Brand Book palette — the only colours in this file */
  --charcoal:#2E2E2E;
  --berry:#7D4047;
  --wine:#6D444A;
  --beige:#B3A799;
  --lightbeige:#DCD5CE;
  /* derived neutrals, warmed toward the beige */
  --paper:#FAF8F5;
  --paper-2:#F2EEE9;
  --rule:#E2DCD5;
  --ink-2:#5C564F;
  --ink-3:#7C746B;
  --pad:clamp(18px,4vw,56px);
  --gap:clamp(16px,2.2vw,30px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--charcoal);
  font:300 15px/1.6 Montserrat,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.005em;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--berry);outline-offset:3px}
.lbl{font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--beige)}
.num{font-variant-numeric:tabular-nums}

/* ── the line of precision: a rule that sits above, never through ── */
.precision{position:relative;padding-top:16px}
.precision::before{content:"";position:absolute;top:0;left:0;width:34px;height:1px;background:var(--berry)}

/* ───────────────── masthead ───────────────── */
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:clamp(12px,2vw,28px);padding:22px var(--pad) 18px}
.wordmark{flex:none;display:block;padding:4px 10px 4px 0}
.wordmark img{width:clamp(124px,13vw,168px);height:auto}
.spacer{flex:1}
.find{display:flex;align-items:center;gap:10px;flex:0 1 300px;min-width:0;
  border-bottom:1px solid var(--rule);padding:7px 2px}
.find:focus-within{border-bottom-color:var(--berry)}
.find input{border:0;outline:0;background:none;flex:1;min-width:0;font:inherit;letter-spacing:.02em}
.find input::placeholder{color:var(--beige)}
.find svg{flex:none;color:var(--beige)}
.mode{display:flex;flex:none;border:1px solid var(--rule)}
.mode button{padding:8px 16px;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--beige)}
.mode button[aria-pressed="true"]{background:var(--charcoal);color:var(--paper)}

nav{display:flex;gap:0;padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
nav::after{content:"";flex:none;width:var(--pad)}
nav::-webkit-scrollbar{display:none}
nav button{padding:14px 15px 13px;font-size:11px;font-weight:400;letter-spacing:.16em;
  text-transform:uppercase;color:var(--beige);white-space:nowrap;border-bottom:1px solid transparent;margin-bottom:-1px}
nav button:first-child{padding-left:0}
nav button[aria-pressed="true"]{color:var(--charcoal);border-bottom-color:var(--berry)}

/* ───────────────── opening band ───────────────── */
.band{padding:clamp(34px,6vw,72px) var(--pad) clamp(26px,4vw,46px);
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px var(--gap);border-bottom:1px solid var(--rule)}
.band h1{font-weight:200;font-size:clamp(30px,5.4vw,58px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance;flex:1 1 340px}
.band h1 em{font-style:normal;color:var(--beige)}
.motto{flex:0 1 300px;font-size:12px;line-height:1.9;color:var(--beige);letter-spacing:.04em;text-align:right;margin-left:auto}
.motto b{display:block;font-weight:400;color:var(--ink-2)}

/* ───────────────── controls ───────────────── */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:20px var(--pad);border-bottom:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--rule);padding:6px 12px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--beige)}
.chip[aria-pressed="true"]{border-color:var(--charcoal);color:var(--charcoal)}
.chip.berry[aria-pressed="true"]{border-color:var(--berry);color:var(--berry)}
select{font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 20px 6px 0;cursor:pointer;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--beige) 50%),linear-gradient(135deg,var(--beige) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.tally{margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--beige);white-space:nowrap}

/* ───────────────── shop by room ───────────────── */
.rooms{padding:clamp(22px,3.4vw,40px) var(--pad);border-bottom:1px solid var(--rule)}
.rooms[hidden]{display:none}
.rlbl{margin-bottom:14px}
.rtiles{display:grid;gap:clamp(10px,1.4vw,18px);
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.rtile{position:relative;display:block;text-align:left;overflow:hidden;
  background:var(--paper-2);padding:0;aspect-ratio:3/2}
.rtile .rshot{position:absolute;inset:0;display:block}
.rtile .rshot img{width:100%;height:100%;object-fit:cover;
  transition:transform .6s ease;filter:saturate(.94)}
.rtile:hover .rshot img{transform:scale(1.04)}
.rtile::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(46,46,46,.05) 40%,rgba(46,46,46,.62) 100%)}
.rtile .rname,.rtile .rn{position:relative;z-index:2;color:#FAF8F5}
.rtile .rname{position:absolute;left:14px;bottom:12px;font-size:14px;
  font-weight:400;letter-spacing:.02em;text-shadow:0 1px 12px rgba(46,46,46,.5)}
.rtile .rn{position:absolute;right:14px;bottom:13px;font-size:11px;
  color:var(--lightbeige);letter-spacing:.06em}
.rtile[aria-pressed="true"]{outline:1.5px solid var(--berry);outline-offset:-1.5px}
.rtile.all{aspect-ratio:auto;display:grid;place-items:center;background:none;
  border:1px solid var(--rule);min-height:64px;
  font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--beige)}
.rtile.all:hover{border-color:var(--berry);color:var(--berry)}
.rtile.all::after{display:none}

/* ───────────────── chapters ───────────────── */
.grid.chaptered{display:block}
.chapter{margin-bottom:clamp(40px,5vw,78px)}
.chapter:last-child{margin-bottom:0}
.chead{display:flex;align-items:baseline;gap:16px;padding-bottom:16px;margin-bottom:clamp(20px,2.6vw,32px);
  border-bottom:1px solid var(--rule);position:relative}
.chead::before{content:"";position:absolute;bottom:-1px;left:0;width:40px;height:1px;background:var(--berry)}
.chead h2{font-weight:300;font-size:clamp(19px,2.4vw,26px);letter-spacing:.005em}
.chead .n{margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--beige);white-space:nowrap}

/* ───────────────── grid ───────────────── */
main{padding:clamp(26px,4vw,48px) var(--pad) 0;max-width:1680px;margin:0 auto}
.grid{display:grid;gap:clamp(26px,3.4vw,52px) var(--gap);grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{text-align:left;display:flex;flex-direction:column;gap:0}
/* Square, and the whole photograph inside it. The library mixes wide room
   shots, upright wardrobes and square cut-outs; a 4:3 frame filled edge to edge
   cut the tall ones in half. Nothing is cropped now — a photo that is not
   square simply sits on the beige. */
.shot{aspect-ratio:4/3;width:100%;background:var(--paper-2);overflow:hidden;position:relative;display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:contain}
/* The frame centres its contents, and a centred grid item ignores height:100%
   and takes its own height instead — an upright photo then overflowed the frame
   and was clipped, whatever shape the frame was. Taking the image out of the
   flow pins it to the frame, so object-fit can do its job. */
.card .shot img,
.thumbs .shot img{position:absolute;inset:0}
.ph{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px;text-align:center}
.ph i{display:block;width:26px;height:1px;background:var(--beige);opacity:.7}
.ph span{font-size:9px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--beige)}
.card:hover .shot img{transform:scale(1.02)}
.shot img{transition:transform .5s ease}
.cbody{padding:14px 0 0;border-top:1px solid var(--rule);margin-top:14px;display:flex;flex-direction:column;gap:5px}
.card:hover .cbody{border-top-color:var(--berry)}
.cbody .eyebrow{font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--beige)}
.cbody h3{font-weight:400;font-size:16px;letter-spacing:.01em;line-height:1.3}
.cbody .price{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cbody .price em{font-style:normal;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--beige);margin-left:8px}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.flag{font-size:8.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--rule);color:var(--beige)}
.flag.on{border-color:var(--berry);color:var(--berry)}
.flag.id{border-color:var(--lightbeige);color:var(--ink-2)}
.empty{padding:90px 0;text-align:center;color:var(--beige);font-size:13px;letter-spacing:.08em}

/* ───────────────── detail sheet ───────────────── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheetbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:14px var(--pad)}
.back{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.back:hover{color:var(--berry)}
.detail{max-width:1440px;margin:0 auto;padding:clamp(24px,4vw,56px) var(--pad) 0;
  display:grid;gap:clamp(28px,4vw,64px)}
@media(min-width:960px){.detail{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .info{position:sticky;top:96px}}
.gallery{display:flex;flex-direction:column;gap:10px}
/* The big photo on a product page keeps its own shape instead of sitting in a
   fixed frame, so an upright wardrobe is shown tall and a room shot wide, both
   as large as the screen allows. */
.gallery>.shot{aspect-ratio:auto;min-height:220px}
.gallery>.shot img{width:100%;height:auto;max-height:76vh;object-fit:contain;background:var(--paper-2)}
.thumbs button{padding:0;display:block;width:100%}
.thumbs .shot img{object-fit:contain;background:var(--paper-2)}
.thumbs button[aria-current="true"] .shot{outline:1px solid var(--berry);outline-offset:-1px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs .shot{aspect-ratio:1}
.thumbs .ph span{font-size:8px;letter-spacing:.16em}
.info h2{font-weight:200;font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.012em;margin:10px 0 14px;text-wrap:balance}
.collink{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--berry);border-bottom:1px solid transparent}
.collink:hover{border-bottom-color:var(--berry)}
.lede{color:var(--ink-2);font-size:14.5px;line-height:1.75;max-width:52ch;margin-bottom:30px}
.setline{border-top:1px solid var(--charcoal);padding:18px 0 20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.setline .n{font-weight:200;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.setline .l{flex-basis:100%;margin-bottom:8px}
.indiv{font-size:12px;color:var(--beige);letter-spacing:.04em;margin:-8px 0 30px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
caption{text-align:left;padding-bottom:12px}
th{text-align:left;font-weight:500;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--beige);
  padding:0 0 10px;border-bottom:1px solid var(--rule)}
th:last-child,td:last-child{text-align:right}
td{padding:16px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td .pc{font-weight:400;font-size:14px}
td .pc i{font-style:normal;color:var(--beige);margin-left:7px;font-size:12px}
td .dim{font-size:12px;color:var(--ink-2);margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
td .mt.cf{color:var(--berry)}
td .mt{font-size:12px;color:var(--ink-3);margin-top:5px;max-width:42ch;line-height:1.6}
td .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px;color:var(--ink-2)}
.share{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.share button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);
  padding:10px 15px;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.share button:hover{border-color:var(--berry);color:var(--berry)}
.share button svg{flex:none}
.share .done{border-color:var(--berry);color:var(--berry)}
.printhead{display:none}
.care{margin-top:30px;padding-top:22px;border-top:1px solid var(--rule);font-size:12.5px;line-height:1.8;color:var(--ink-3)}
.care span{display:block;max-width:56ch}
.care b{display:block;margin-bottom:10px}
.rel{grid-column:1/-1;border-top:1px solid var(--rule);margin-top:clamp(30px,4vw,56px);padding-top:clamp(26px,3vw,40px)}
.rel h4{font-weight:300;font-size:20px;letter-spacing:.01em;margin-bottom:6px}
.rel p{font-size:12px;color:var(--beige);letter-spacing:.04em;margin-bottom:26px}

/* ───────────────── full-screen photograph ───────────────── */
/* Tapping a photo opens it as large as the screen allows, never cropped. */
.viewer{position:fixed;inset:0;z-index:80;background:#181716;
  display:grid;grid-template-rows:1fr auto;padding:clamp(10px,2.5vw,34px)}
.viewer[hidden]{display:none}
.vstage{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
/* min-width and min-height must be said out loud. A flex or grid item will not
   shrink below its own natural size on its own, and that beats max-height, so
   an upright photograph was drawn at full width and its top and bottom fell
   outside the screen — it looked zoomed in. Measured on a tablet in landscape:
   a 1600x2400 photograph came out 1121x1682 in a 1121x727 space. */
.vstage img{max-width:100%;max-height:100%;min-width:0;min-height:0;
  width:auto;height:auto;object-fit:contain}
.vbtn{position:absolute;z-index:2;color:var(--lightbeige);display:grid;place-items:center;
  width:46px;height:46px;border:1px solid rgba(220,213,206,.28);background:rgba(28,27,26,.5)}
.vbtn:hover{color:#FAF8F5;border-color:rgba(220,213,206,.6)}
.vclose{top:clamp(10px,2.5vw,34px);right:clamp(10px,2.5vw,34px)}
.vprev{left:clamp(6px,2vw,28px);top:50%;transform:translateY(-50%)}
.vnext{right:clamp(6px,2vw,28px);top:50%;transform:translateY(-50%)}
.viewer.single .vprev,.viewer.single .vnext{display:none}
.vfoot{display:flex;align-items:baseline;gap:16px;padding:14px 2px 2px;color:var(--beige);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.vfoot .num{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.gallery>.shot{cursor:zoom-in}
@media(max-width:620px){
  .vbtn{width:40px;height:40px}
  .vprev{left:4px}.vnext{right:4px}
}
@media print{.viewer{display:none!important}}

footer{margin-top:clamp(50px,7vw,100px);border-top:1px solid var(--rule);
  padding:34px var(--pad) 56px;display:flex;flex-wrap:wrap;gap:14px 40px;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--beige)}
footer .r{margin-left:auto;text-align:right;text-transform:none;letter-spacing:.04em;font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header,.band,.controls,main,footer,.sheetbar,.share,.rel,.thumbs{display:none!important}
  
  .sheet{position:static;overflow:visible}
  .sheet[hidden]{display:block}
  .detail{display:block;padding:0;max-width:none}
  .gallery{margin-bottom:22px}
  .shot{aspect-ratio:16/9}
  .printhead{display:block;margin-bottom:26px}
  .printhead img{width:150px}
  body{background:#fff}
  td,th{border-color:#ccc}
}
@media(max-width:620px){
  .bar{flex-wrap:wrap}
  .find{flex:1 1 100%;order:3}
  .motto{text-align:left;margin-left:0}
}

</style>
</head>

<script>
/* Drive photos: if the fast image link fails, fall back to Drive's thumbnail
   link, then give up quietly and leave the placeholder showing.
   Proven in reference/drive_photo_test_WORKING.html, confirmed by the owner
   on 20 Sep 2026. */
document.addEventListener("error", function (ev) {
  var img = ev.target;
  if (!img || img.tagName !== "IMG") return;
  // The site's own copy first; if it is missing, ask Drive for that photograph.
  var own = img.src.match(/photos\/t\/([A-Za-z0-9_-]+)\.webp/);
  if (own && !img.dataset.retry) {
    img.dataset.retry = "1";
    img.src = "https://lh3.googleusercontent.com/d/" + own[1] + "=w600";
    return;
  }
  var m = img.src.match(/googleusercontent\.com\/d\/([^=\/?]+)=w(\d+)/);
  if (m && !img.dataset.retry) {
    img.dataset.retry = "1";
    img.src = "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w" + m[2];
    return;
  }
  if (img.dataset.retry === "1") {
    img.dataset.retry = "2";
    img.closest(".shot") && img.closest(".shot").classList.add("failed");
    img.remove();
  }
}, true);
</script>

<script>
/* ELMORA catalogue — behaviour only. No product data lives in this file.
   The data is injected by site/build.py into the #elmora-data block. */

const BUNDLE = JSON.parse(document.getElementById("elmora-data").textContent);
const P = BUNDLE.products;
const MODE = BUNDLE.mode;                 /* "client" or "staff" */
const STAFF = MODE === "staff";

/* Navigation order is fixed by the master instructions, section 19.
   Left value is the label shown; right value is the Category exactly as
   it is written in the product master. */
const CATS = [
  ["All products", null],
  ["Master Bedrooms", "Master Bedrooms"],
  ["Teenager / Kids", "Teenager Bedrooms"],
  ["Sofa Sets", "Sofa Sets"],
  ["Dining", "Dining"],
  ["Coffee Tables & TV Units", "Coffee Tables & TV Units"],
  ["Ceramic Tables", "Ceramic Dining Tables"],
  ["Outdoor", "Outdoor"],
  ["Wardrobes", "Wardrobes"],
  ["Chairs & Armchairs", "Chairs & Armchairs"],
  ["Mirrors", "Mirrors"]
];
const READY = [
  ["Everything", "all"],
  ["Ready to show", "ready"],
  ["Needs photography", "nophoto"],
  ["Needs price", "noprice"]
];

let cat = null, ready = "all", coll = "", q = "", sales = STAFF, open = null;

const mzn = n => n == null ? null : Number(n).toLocaleString("en-US").replace(/,/g, " ") + " MT";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const needsCheck = p => !!p.check;

/* The owner decided on 21 Sep 2026 that every product appears, with or without
   a photograph, so that the catalogue is complete while photography catches up.
   A product with no price reads "Price on request". */
const visible = () => true;

/* Rooms: a second way in, beside the categories. A room is a set of
   categories, named in data/rooms.json. */
const ROOMS = BUNDLE.rooms || [];
let room = null;

/* Cards use the small file, the detail gallery the large one — a showroom
   tablet or a phone in Beira should not download full-size images to scroll. */
function shot(p, size = "t", label) {
  if (p.photos && p.photos.length) {
    const src = p.photos[0][size] || p.photos[0].l;
    return `<div class="shot"><img src="${esc(src)}" alt="${esc(p.title)}" loading="lazy" decoding="async"></div>`;
  }
  return `<div class="shot"><div class="ph"><i></i><span>${esc(label || p.coll || p.title)}</span></div></div>`;
}

function inRoom(p) {
  if (!room) return true;
  const r = ROOMS.find(x => x.key === room);
  return !!r && r.cats.includes(p.cat);
}

function pool() {
  return P.filter(p => {
    if (!inRoom(p)) return false;
    if (cat && p.cat !== cat) return false;
    if (coll && p.coll !== coll) return false;
    if (sales && ready === "ready" && !p.ready) return false;
    if (sales && ready === "nophoto" && p.hasPhoto) return false;
    if (sales && ready === "noprice" && p.hasPrice) return false;
    if (q) {
      const h = (p.title + " " + (p.coll || "") + " " + p.tag + " " +
        p.pieces.map(x => x.sku || "").join(" ")).toLowerCase();
      if (!h.includes(q.toLowerCase())) return false;
    }
    return true;
  });
}

function renderRooms() {
  const el = document.getElementById("rooms");
  if (!el || !ROOMS.length) return;
  el.hidden = false;
  el.innerHTML =
    `<div class="rlbl lbl">Shop by room</div><div class="rtiles">` +
    ROOMS.map(r => `
      <button class="rtile" data-room="${esc(r.key)}" aria-pressed="${room === r.key}">
        <span class="rshot">${r.photo
          ? `<img src="${esc(r.photo)}" alt="" loading="lazy" decoding="async">` : ""}</span>
        <span class="rname">${esc(r.name)}</span>
        <span class="rn num">${r.n}</span>
      </button>`).join("") +
    (room ? `<button class="rtile all" data-room="">All rooms</button>` : "") +
    `</div>`;
}

function renderCats() {
  document.getElementById("cats").innerHTML = CATS.map(([label, value]) => {
    const n = P.filter(p => !value || p.cat === value).length;
    if (!n && value) return "";
    return `<button data-c="${esc(value || "")}" aria-pressed="${(value || null) === cat}">${esc(label)}</button>`;
  }).join("");
}

function renderControls() {
  document.getElementById("ready").innerHTML = sales ? READY.map(([label, value]) =>
    `<button class="chip berry" data-r="${value}" aria-pressed="${value === ready}">${esc(label)}</button>`).join("") : "";
  const names = [...new Set(P.filter(p => (!cat || p.cat === cat) && p.coll).map(p => p.coll))].sort();
  document.getElementById("coll").innerHTML =
    `<option value="">All collections</option>` +
    names.map(n => `<option value="${esc(n)}"${n === coll ? " selected" : ""}>${esc(n)}</option>`).join("");
  const label = cat ? (CATS.find(c => c[1] === cat) || ["", ""])[0] : "The complete range";
  document.getElementById("bandTitle").innerHTML = esc(coll || label) + "<em>.</em>";
}

function card(p) {
  const flags = [];
  ;
  // The cover's own proportions travel with the card as --ar. A design that
  // wants every frame the same shape simply ignores it.
  const ar = p.ar ? ` style="--ar:${p.ar}"` : "";
  return `<button class="card" data-t="${esc(p.tag)}"${ar}>
    ${shot(p)}
    <div class="cbody">
      <div class="eyebrow">${esc(p.coll || p.cat)}</div>
      <h3>${esc(p.title)}</h3>
      <div class="price">${p.setprice ? mzn(p.setprice) : "Price on request"}${p.setprice && p.pieces.length > 1 ? "<em>complete set</em>" : ""}</div>
      ${flags.length ? `<div class="flags">${flags.join("")}</div>` : ""}
    </div>
  </button>`;
}

/* Chapters: browsing everything reads as a book of categories; inside a
   category or a room it reads as a book of collections. A search is a flat
   list — someone searching wants the answer, not chapters. */
function chaptersFor(items) {
  if (q || coll || items.length < 8) return null;
  const byCollection = !!(cat || room);
  const groups = new Map();
  items.forEach(p => {
    const name = byCollection ? (p.coll || "Individual pieces") : p.cat;
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(p);
  });
  /* A chapter holding one piece is not a chapter. Inside a category or a room
     most collections have a single product, so those are gathered together
     rather than each getting a heading of its own. */
  if (byCollection) {
    const singles = [];
    [...groups.entries()].forEach(([name, list]) => {
      if (list.length === 1 && name !== "Individual pieces") {
        singles.push(list[0]);
        groups.delete(name);
      }
    });
    if (singles.length) {
      groups.set("Individual pieces",
        (groups.get("Individual pieces") || []).concat(singles));
    }
  }
  if (groups.size < 2) return null;
  let names = [...groups.keys()];
  if (byCollection) {
    names.sort((a, b) => a === "Individual pieces" ? 1 : b === "Individual pieces" ? -1
      : a.localeCompare(b));
  } else {
    const order = CATS.map(c => c[1]);
    names.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  }
  return names.map(n => [n, groups.get(n)]);
}

function renderGrid() {
  const items = pool();
  const grid = document.getElementById("grid");
  const chapters = chaptersFor(items);
  grid.classList.toggle("chaptered", !!chapters);
  grid.innerHTML = chapters
    ? chapters.map(([name, group]) => `
        <section class="chapter">
          <div class="chead">
            <h2>${esc(name)}</h2>
            <span class="n num">${group.length}${group.length === 1 ? " piece" : " pieces"}</span>
          </div>
          <div class="grid gset">${group.map(card).join("")}</div>
        </section>`).join("")
    : items.map(card).join("");
  document.getElementById("empty").hidden = items.length > 0;
  document.getElementById("tally").textContent =
    items.length + (items.length === 1 ? " product" : " products");
  document.getElementById("foot").textContent = sales
    ? `${P.filter(p => p.ready).length} of ${P.length} products ready to show`
    : `${P.length} products`;
}

function renderDetail(p) {
  const many = p.pieces.length > 1;
  const family = p.coll ? P.filter(x => x.coll === p.coll && x.tag !== p.tag) : [];
  const anyPiecePrice = p.pieces.some(x => x.pr);
  document.getElementById("detail").innerHTML = `
    <div class="printhead"><img src="${esc(BUNDLE.logo)}" alt="Elmora"></div>
    <div class="gallery">
      ${shot(p, "l")}
      ${p.photos && p.photos.length > 1 ? `<div class="thumbs">${p.photos.map((ph, n) => `
        <button data-shot="${n}" aria-current="${n === 0}" aria-label="View photograph ${n + 1}">
          <div class="shot"><img src="${esc(ph.t || ph.l)}" alt="" loading="lazy" decoding="async"></div>
        </button>`).join("")}</div>` : ""}
    </div>
    <div class="info">
      ${p.coll ? `<button class="collink" data-coll="${esc(p.coll)}">${esc(p.coll)} collection</button>` : `<div class="lbl">${esc(p.cat)}</div>`}
      <h2>${esc(p.title)}</h2>
      ${p.desc ? `<p class="lede">${esc(p.desc)}</p>` : ""}
      ${p.setprice ? `<div class="setline">
        <div class="l lbl">${many ? "Complete set" : "Price"}</div>
        <div class="n">${mzn(p.setprice)}</div>
      </div>` : `<div class="setline">
        <div class="l lbl">Price</div>
        <div class="n">On request</div>
      </div>`}
      ${many ? `<p class="indiv">Every piece is also available individually.</p>` : ""}
      ${p.pieces.length ? `<table>
        <thead><tr><th>${many ? "Pieces in the set" : "Specification"}</th><th>${anyPiecePrice ? "Price" : ""}</th></tr></thead>
        <tbody>${p.pieces.map(pc => `
          <tr>
            <td>
              <div class="pc">${esc(pc.p)}${pc.q > 1 ? ` <i>× ${pc.q}</i>` : ""}</div>
              ${pc.dim ? `<div class="dim">${esc(pc.dim)}</div>` : ""}
              ${pc.mat ? `<div class="mt">${esc(pc.mat)}</div>` : ""}
              ${""}
            </td>
            <td class="amt">${pc.pr ? mzn(pc.pr) : ""}</td>
          </tr>`).join("")}
        </tbody>
      </table>` : ""}
      <div class="share">
        <button data-share="wa"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.8-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>Send on WhatsApp</button>
        <button data-share="copy">Copy link</button>
        <button data-share="print">Save as PDF</button>
      </div>
      ${p.care ? `<div class="care"><b class="lbl">Care</b><span>${esc(p.care)}</span></div>` : ""}
      ${""}
    </div>
    ${family.length ? `<div class="rel">
      <h4>The rest of the ${esc(p.coll)} collection</h4>
      <p>Each piece is sold separately. Nothing here has to be bought as a set.</p>
      <div class="grid">${family.map(card).join("")}</div>
    </div>` : ""}`;
}

/* A shared link always opens the public catalogue, whichever build it was
   copied from, so a staff link can never be sent to a customer. */
const linkFor = tag => (BUNDLE.clientBase || location.href.split("#")[0]) + "#" + tag;

function show(tag, push = true) {
  open = P.find(p => p.tag === tag);
  if (!open) return;
  shotNo = 0;
  renderDetail(open);
  const s = document.getElementById("sheet");
  s.hidden = false; s.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (push) { try { history.pushState({ tag }, "", "#" + tag); } catch (e) {} }
}
function hide(pop = false) {
  if (viewer && !viewer.hidden) { viewer.hidden = true; }
  open = null;
  document.getElementById("sheet").hidden = true;
  document.body.style.overflow = "";
  if (!pop) { try { history.pushState({}, "", location.pathname + location.search); } catch (e) {} }
}
window.addEventListener("popstate", e => {
  const tag = (e.state && e.state.tag) || location.hash.replace("#", "");
  if (tag && P.some(p => p.tag === tag)) show(tag, false); else hide(true);
});

;

document.addEventListener("click", e => {
  const t = e.target.closest("[data-room]");
  if (!t) return;
  hide();
  room = t.dataset.room || null;
  cat = null; coll = "";
  renderRooms(); renderCats(); renderControls(); renderGrid();
  document.getElementById("rooms").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.getElementById("cats").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]"); if (!b) return;
  room = null; renderRooms();
  cat = b.dataset.c || null; coll = "";
  renderCats(); renderControls(); renderGrid();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("ready").addEventListener("click", e => {
  const b = e.target.closest("button[data-r]"); if (!b) return;
  ready = b.dataset.r; renderControls(); renderGrid();
});
document.getElementById("coll").addEventListener("change", e => {
  coll = e.target.value; renderControls(); renderGrid();
});
document.addEventListener("click", e => {
  const link = e.target.closest("[data-coll]");
  if (link) { hide(); cat = null; room = null; renderRooms(); coll = link.dataset.coll; renderCats(); renderControls(); renderGrid(); return; }
  const c = e.target.closest(".card");
  if (c) show(c.dataset.t);
});
document.getElementById("back").addEventListener("click", () => hide());
document.getElementById("home").addEventListener("click", e => {
  e.preventDefault(); hide(); cat = null; room = null; coll = ""; ready = "all"; q = "";
  renderRooms();
  document.getElementById("q").value = "";
  renderCats(); renderControls(); renderGrid();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-shot]");
  if (t && open) {
    showShot(+t.dataset.shot);
    return;
  }
  const b = e.target.closest("[data-share]"); if (!b || !open) return;
  const url = linkFor(open.tag);
  if (b.dataset.share === "wa") {
    window.open("https://wa.me/?text=" + encodeURIComponent(open.title + " — Elmora\n" + url), "_blank", "noopener");
  } else if (b.dataset.share === "copy") {
    navigator.clipboard && navigator.clipboard.writeText(url).then(() => {
      b.textContent = "Link copied"; b.classList.add("done");
      setTimeout(() => { b.textContent = "Copy link"; b.classList.remove("done"); }, 2200);
    });
  } else {
    window.print();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && open && viewer.hidden) hide();
});
document.getElementById("q").addEventListener("input", e => { q = e.target.value; renderGrid(); });

;

/* ── the photograph, full screen ──────────────────────────────────────────────
 The owner asked to see the whole picture when he taps one. The frame on the
 product page is a fixed shape so the page stays tidy; this has no frame at
 all, so nothing is ever cropped. */

let shotNo = 0;

function showShot(n) {
if (!open || !open.photos || !open.photos.length) return;
shotNo = (n + open.photos.length) % open.photos.length;
const main = document.querySelector(".gallery > .shot img");
if (main) { delete main.dataset.retry; main.src = open.photos[shotNo].l; }
document.querySelectorAll(".thumbs [data-shot]").forEach(x =>
  x.setAttribute("aria-current", String(+x.dataset.shot === shotNo)));
}

const viewer = document.getElementById("viewer");

function viewerPaint() {
const img = document.getElementById("vimg");
delete img.dataset.retry;
img.src = open.photos[shotNo].l;
img.alt = open.title;
document.getElementById("vtitle").textContent = open.title;
document.getElementById("vcount").textContent =
  open.photos.length > 1 ? (shotNo + 1) + " / " + open.photos.length : "";
viewer.classList.toggle("single", open.photos.length < 2);
}

function viewerOpen(n) {
if (!open || !open.photos || !open.photos.length) return;
shotNo = (n + open.photos.length) % open.photos.length;
viewerPaint();
viewer.hidden = false;
document.body.style.overflow = "hidden";
document.getElementById("vclose").focus();
}

function viewerClose() {
viewer.hidden = true;
document.body.style.overflow = "";
showShot(shotNo);              // leave the product page on the same photo
}

function viewerStep(d) {
shotNo = (shotNo + d + open.photos.length) % open.photos.length;
viewerPaint();
}

// tapping the big photograph opens it
document.addEventListener("click", e => {
if (!viewer.hidden) return;
if (e.target.closest(".gallery > .shot") && open && open.photos.length) {
  viewerOpen(shotNo);
}
});

document.getElementById("vclose").addEventListener("click", viewerClose);
document.getElementById("vprev").addEventListener("click", () => viewerStep(-1));
document.getElementById("vnext").addEventListener("click", () => viewerStep(1));
// a tap on the dark surround closes, a tap on the photograph does not
viewer.addEventListener("click", e => {
if (!e.target.closest(".vbtn") && !e.target.closest("#vimg")) viewerClose();
});

document.addEventListener("keydown", e => {
if (viewer.hidden) return;
if (e.key === "Escape") { viewerClose(); e.preventDefault(); }
else if (e.key === "ArrowLeft") { viewerStep(-1); e.preventDefault(); }
else if (e.key === "ArrowRight") { viewerStep(1); e.preventDefault(); }
});

// swipe, for the tablet
let swipeX = null, swipeY = null;
viewer.addEventListener("touchstart", e => {
if (e.touches.length !== 1) { swipeX = null; return; }
swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY;
}, { passive: true });
viewer.addEventListener("touchend", e => {
if (swipeX == null || !e.changedTouches.length) return;
const dx = e.changedTouches[0].clientX - swipeX;
const dy = e.changedTouches[0].clientY - swipeY;
swipeX = null;
if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) viewerStep(dx < 0 ? 1 : -1);
}, { passive: true });

renderRooms(); renderCats(); renderControls(); renderGrid();

/* Deep link: …/#SOF-01 opens straight on that product, which is what a
   WhatsApp or email link has to do on the client's phone. */
(function () {
  const tag = location.hash.replace("#", "");
  if (tag && P.some(p => p.tag === tag)) { ; show(tag, false); }
})();

</script>
</body>
</html>
